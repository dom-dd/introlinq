name: Daily publisher discovery

# Vercel's Hobby plan caps native Cron Jobs at 2 per account (already used
# by api/sync/openintro and api/cron/weekly-stats) AND caps Serverless
# Functions at 12 per deployment (already at the limit), so this daily
# trigger lives here instead - the discovery logic runs inside the existing
# api/admin.js function (resource=run-discovery) rather than a new file,
# triggered by GitHub Actions' free scheduler rather than Vercel's own cron.
#
# Three runs/day, 06:00 / 12:00 / 18:00 UTC. run-discovery (see api/admin.js)
# caps itself at SEARCHES_PER_DAY (100) SerpAPI searches per UTC day, counted
# from OUR OWN discovery_queries rows - the key is a shared account so we
# can't budget off SerpAPI's own monthly counter. Each run does up to
# whatever's left of today's 100 (the ~50s time budget usually stops a single
# run around 80-100), so the later runs mop up any shortfall and also cover
# GitHub Actions silently dropping an earlier one. SEARCHES_PER_DAY /
# MAX_SEARCHES_PER_RUN / PLAN_SAFETY_FLOOR are in discovery/lib/serpapi.js.
#
# After discovery, this also runs discovery/classify.js directly on the
# runner (not through api/admin.js - that function is already at Vercel's
# 12-function cap and its 60s maxDuration is too tight for a full classify+
# enrich batch). classify.js auto-cascades into Apollo enrichment for
# whatever it classifies as "publisher". Needs DATABASE_URL, ANTHROPIC_API_KEY
# and APOLLO_API_KEY as repo secrets (Settings -> Secrets and variables ->
# Actions) in addition to CRON_SECRET - these spend real money per lead, so
# removing/renaming any of them here pauses that spend without touching code.
on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch: {} # allows a manual "Run workflow" trigger from the Actions tab

jobs:
  trigger-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Call discovery endpoint
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" --max-time 75 \
            -X GET "https://www.introlinq.com/api/admin?resource=run-discovery" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat response.json
          if [ "$status" -ne 200 ]; then
            echo "Discovery cron failed"
            exit 1
          fi

      # Runs even if discovery above failed (always()) - classify/enrich talk
      # directly to Neon/Anthropic/Apollo, not through Vercel, so a Vercel-side
      # failure has no bearing on whether there's a backlog worth processing.
      - name: Checkout
        if: always()
        uses: actions/checkout@v4

      - name: Set up Node
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: always()
        run: npm ci

      # Added 2026-08-26 - SerpAPI's free keyword search plateaus in the low
      # thousands (bounded by our finite topic list + what Google indexes for
      # those exact phrases); Apollo's own database is a much larger pool of
      # real companies, so it's the actual scale lever for volume, at a real
      # per-lead cost. 25 credits x 2 runs/day (~1500/month) is deliberately
      # conservative - this shares a 3.1k/month credit pool with OpenIntro's
      # own usage and classify.js's enrichment cascade below, so it's sized
      # to sustain daily volume without crowding either out. Tune --credits
      # here (or drop this step) if the monthly balance runs tight.
      - name: Discover via Apollo search
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
        run: node discovery/apollo-search.js --category "Business & Entrepreneurship" --credits 25

      - name: Classify + enrich publisher leads
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
        run: node discovery/classify.js
